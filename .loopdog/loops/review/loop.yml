# Review: cross-provider adversarial review + intent-diff against criteria.
name: review
trigger:
  github_event: pull_request
  action: [opened, synchronize, ready_for_review]
transition: { from: in-review, to: verified, fallback: changes-requested }
expects: comment
gates: { require_dor: false, require_ci: true, tier: default }
# Cross-provider review normally dispatches to Codex; for this dogfood (no Codex
# mention token yet) review falls back to the Claude routine so the loop closes.
# Switch back to `backend: codex` once LOOPDOG_CODEX_MENTION_TOKEN is set.
backend: claude
mode: act
